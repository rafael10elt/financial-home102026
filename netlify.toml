[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# SPA: todas as rotas caem no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Não servir arquivos de controle nem ambiente
[[headers]]
  for = "/.env*"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
